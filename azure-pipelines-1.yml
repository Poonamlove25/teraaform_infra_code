trigger:
 branches:
   include:
     - main

pool: pool

stages:
  - stage: terraforminitandapply
    displayName: terraForm init and apply
    jobs:
      - job: terraforminit
        displayName: terraform init
        steps:
        
        - task: TerraformInstaller@1
          inputs:
            terraformVersion: 'latest'


        - task: TerraformTask@5
          inputs:
            provider: 'azurerm'
            command: 'init'
            workingDirectory: '$(System.DefaultWorkingDirectory)/parent_module'
            backendServiceArm: 'service_connection'
            backendAzureRmResourceGroupName: 'rgssssss'
            backendAzureRmStorageAccountName: 'Storageatg96897'
            backendAzureRmContainerName: 'Container'
            backendAzureRmKey: 'teraform.tfstate'

        - task: TerraformTask@5
          inputs:
            provider: 'azurerm'
            command: 'plan'
            workingDirectory: '$(System.DefaultWorkingDirectory)/parent_module'
            environmentServiceNameAzureRM: 'service_connection'
        

        - task: TerraformTask@5
          inputs:
            provider: 'azurerm'
            command: 'apply'
            workingDirectory: '$(System.DefaultWorkingDirectory)/parent_module'
            environmentServiceNameAzureRM: 'service_connection'
            
